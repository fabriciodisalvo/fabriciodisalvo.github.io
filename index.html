<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card Code Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #111;
      color: white;
    }

    header {
      padding: 12px;
      background: #222;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    main {
      padding: 12px;
    }

    video {
      width: 100%;
      max-height: 55vh;
      background: black;
      border-radius: 12px;
    }

    .camera-wrap {
      position: relative;
    }

    .scan-box {
      position: absolute;
      right: 8%;
      top: 8%;
      width: 42%;
      height: 18%;
      border: 3px solid #00ff99;
      border-radius: 8px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
      pointer-events: none;
    }

    button {
      font-size: 16px;
      padding: 12px 14px;
      margin: 6px 4px 6px 0;
      border: 0;
      border-radius: 10px;
      background: #00c781;
      color: #061b13;
      font-weight: 700;
    }

    button.secondary {
      background: #444;
      color: white;
    }

    button.danger {
      background: #d94343;
      color: white;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      box-sizing: border-box;
      border-radius: 10px;
      padding: 10px;
      font-size: 16px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .status {
      margin: 10px 0;
      color: #ccc;
    }

    .last {
      font-size: 28px;
      font-weight: 800;
      color: #00ff99;
      margin: 8px 0;
    }

    canvas {
      display: none;
    }
  </style>
</head>

<body>
  <header>
    <strong>Card Code Scanner</strong>
  </header>

  <main>
    <div class="camera-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="scan-box"></div>
    </div>

    <div class="status" id="status">Starting camera…</div>
    <div>Last code:</div>
    <div class="last" id="lastCode">—</div>

    <button id="scanBtn">Scan</button>
    <button id="autoBtn" class="secondary">Start auto-scan</button>
    <button id="copyBtn" class="secondary">Copy list</button>
    <button id="downloadBtn" class="secondary">Download CSV</button>
    <button id="clearBtn" class="danger">Clear</button>

    <p>
      Codes scanned: <strong id="count">0</strong>
    </p>

    <textarea id="output" readonly></textarea>

    <canvas id="canvas"></canvas>
  </main>

  <script>
    let cameraReady = false;
  
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const statusEl = document.getElementById("status");
    const lastCodeEl = document.getElementById("lastCode");
    const outputEl = document.getElementById("output");
    const countEl = document.getElementById("count");

    const scanBtn = document.getElementById("scanBtn");
    const autoBtn = document.getElementById("autoBtn");
    const copyBtn = document.getElementById("copyBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const clearBtn = document.getElementById("clearBtn");

    let codes = JSON.parse(localStorage.getItem("cardCodes") || "[]");
    let worker = null;
    let scanning = false;
    let autoScanning = false;

    function normalizeCode(text) {
      const cleaned = text
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "");

      const match = cleaned.match(/[A-Z0-9]{5}/);
      return match ? match[0] : null;
    }

    function saveCodes() {
      localStorage.setItem("cardCodes", JSON.stringify(codes));
      outputEl.value = codes.join("\n");
      countEl.textContent = codes.length;
    }

    function addCode(code) {
      if (!code) return;

      if (!codes.includes(code)) {
        codes.push(code);
        saveCodes();
        lastCodeEl.textContent = code;
        statusEl.textContent = `Added ${code}`;
      } else {
        lastCodeEl.textContent = code;
        statusEl.textContent = `${code} already scanned`;
      }
    }
    async function initCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusEl.textContent = "Camera unavailable. Use HTTPS or localhost.";
        return;
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });

      video.srcObject = stream;

      await new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play();
        };

        video.oncanplay = () => {
          if (video.videoWidth > 0 && video.videoHeight > 0) {
            cameraReady = true;
            resolve();
          }
        };
      });

      statusEl.textContent = "Camera ready. Align the code inside the green box.";
    }

    async function initOCR() {
      statusEl.textContent = "Loading OCR engine…";

      worker = await Tesseract.createWorker("eng");

      await worker.setParameters({
        tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
        tessedit_pageseg_mode: "7"
      });

      statusEl.textContent = "OCR ready.";
    }

    function captureScanRegion() {
      const videoWidth = video.videoWidth;
      const videoHeight = video.videoHeight;

      if (!videoWidth || !videoHeight) {
        throw new Error("Video is not ready yet.");
      }

      /*
        This crop roughly matches the green box:
        right/top corner area where the card code is expected.
        Adjust these numbers if your code is in a different position.
      */
      const cropX = videoWidth * 0.50;
      const cropY = videoHeight * 0.06;
      const cropW = videoWidth * 0.42;
      const cropH = videoHeight * 0.20;

      canvas.width = cropW;
      canvas.height = cropH;

      const ctx = canvas.getContext("2d", { willReadFrequently: true });

      ctx.drawImage(
        video,
        cropX,
        cropY,
        cropW,
        cropH,
        0,
        0,
        cropW,
        cropH
      );

      /*
        Basic contrast boost for OCR.
      */
      const imageData = ctx.getImageData(0, 0, cropW, cropH);
      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
        const boosted = avg > 140 ? 255 : 0;
        data[i] = boosted;
        data[i + 1] = boosted;
        data[i + 2] = boosted;
      }

      ctx.putImageData(imageData, 0, 0);

      return canvas;
    }

    async function scanOnce() {
      if (scanning) return;
      
      if (!cameraReady || video.videoWidth === 0 || video.videoHeight === 0) {
        statusEl.textContent = "Camera still warming up. Try again in a moment.";
        return;
      }

      if (!worker) {
        statusEl.textContent = "OCR not ready yet.";
        return;
      }

      scanning = true;
      statusEl.textContent = "Scanning…";

      try {
        const scanImage = captureScanRegion();
        const result = await worker.recognize(scanImage);
        const rawText = result.data.text || "";
        const code = normalizeCode(rawText);

        if (code) {
          addCode(code);
        } else {
          statusEl.textContent = `No 5-character code found. OCR saw: "${rawText.trim()}"`;
        }
      } catch (err) {
        statusEl.textContent = `Scan error: ${err.message}`;
      } finally {
        scanning = false;
      }
    }

    async function autoScanLoop() {
      while (autoScanning) {
        await scanOnce();
        await new Promise(resolve => setTimeout(resolve, 1200));
      }
    }

    scanBtn.addEventListener("click", scanOnce);

    autoBtn.addEventListener("click", () => {
      autoScanning = !autoScanning;

      if (autoScanning) {
        autoBtn.textContent = "Stop auto-scan";
        autoBtn.classList.remove("secondary");
        autoScanLoop();
      } else {
        autoBtn.textContent = "Start auto-scan";
        autoBtn.classList.add("secondary");
      }
    });

    copyBtn.addEventListener("click", async () => {
      await navigator.clipboard.writeText(codes.join("\n"));
      statusEl.textContent = "Copied list to clipboard.";
    });

    downloadBtn.addEventListener("click", () => {
      const csv = "code\n" + codes.map(code => `"${code}"`).join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "card-codes.csv";
      a.click();

      URL.revokeObjectURL(url);
    });

    clearBtn.addEventListener("click", () => {
      if (!confirm("Clear all scanned codes?")) return;
      codes = [];
      saveCodes();
      lastCodeEl.textContent = "—";
      statusEl.textContent = "List cleared.";
    });

    saveCodes();

    Promise.all([
      initCamera(),
      initOCR()
    ]).catch(err => {
      statusEl.textContent = err.message;
    });
  </script>
</body>
</html>
