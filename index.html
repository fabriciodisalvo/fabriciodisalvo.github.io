<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card Code Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
:root {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  background: #0f0f0f;
  color: white;
  min-height: 100svh;
  padding-bottom: env(safe-area-inset-bottom);
}

header {
  padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
  background: #1f1f1f;
  position: sticky;
  top: 0;
  z-index: 2;
  font-size: 17px;
}

main {
  padding: 10px 12px 18px;
  max-width: 430px;
  margin: 0 auto;
}

.camera-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 9 / 13;
  max-height: 56svh;
  overflow: hidden;
  border-radius: 18px;
  background: black;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  background: black;
}

.scan-box {
  position: absolute;
  right: 6%;
  top: 6%;
  width: 46%;
  height: 14%;
  border: 3px solid #00ff99;
  border-radius: 10px;
  box-shadow: 0 0 0 9999px rgba(0,0,0,0.36);
  pointer-events: none;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 10px;
}

button {
  font-size: 16px;
  min-height: 48px;
  padding: 12px 10px;
  border: 0;
  border-radius: 14px;
  background: #00c781;
  color: #061b13;
  font-weight: 800;
  touch-action: manipulation;
}

button:disabled {
  opacity: 0.5;
}

button.secondary {
  background: #3c3c3c;
  color: white;
}

button.danger {
  background: #d94343;
  color: white;
}

.status {
  margin: 10px 0 6px;
  color: #d0d0d0;
  font-size: 14px;
  line-height: 1.3;
  min-height: 36px;
}

.last-label {
  font-size: 14px;
  color: #aaa;
}

.last {
  font-size: clamp(34px, 10vw, 48px);
  line-height: 1;
  font-weight: 900;
  color: #00ff99;
  margin: 4px 0 8px;
  letter-spacing: 0.04em;
}

.counter {
  margin: 8px 0;
  font-size: 15px;
}

textarea {
  width: 100%;
  min-height: 130px;
  max-height: 22svh;
  box-sizing: border-box;
  border-radius: 14px;
  border: 0;
  padding: 12px;
  font-size: 16px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  background: #202020;
  color: white;
}

canvas {
  display: none;
}
  </style>
</head>

<body>
  <header>
    <strong>Card Code Scanner</strong>
  </header>

  <main>
    <div class="camera-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="scan-box"></div>
    </div>
  <div class="status" id="status">Starting camera…</div>

  <div class="last-label">Last code:</div>
  <div class="last" id="lastCode">—</div>

  <div class="controls">
    <button id="scanBtn">Scan</button>
    <button id="autoBtn" class="secondary">Auto</button>
    <button id="copyBtn" class="secondary">Copy</button>
    <button id="downloadBtn" class="secondary">CSV</button>
    <button id="clearBtn" class="danger">Clear</button>
  </div>

  <p class="counter">
    Codes scanned: <strong id="count">0</strong>
  </p>

  <textarea id="output" readonly></textarea>

    <canvas id="canvas"></canvas>
  </main>

  <script>
    let cameraReady = false;
  
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const statusEl = document.getElementById("status");
    const lastCodeEl = document.getElementById("lastCode");
    const outputEl = document.getElementById("output");
    const countEl = document.getElementById("count");

    const scanBtn = document.getElementById("scanBtn");
    const autoBtn = document.getElementById("autoBtn");
    const copyBtn = document.getElementById("copyBtn");
    const downloadBtn = document.getElementById("downloadBtn");
    const clearBtn = document.getElementById("clearBtn");

    let codes = JSON.parse(localStorage.getItem("cardCodes") || "[]");
    let worker = null;
    let scanning = false;
    let autoScanning = false;

    function normalizeCode(text) {
      const cleaned = text
        .toUpperCase()
        .replace(/[^A-Z0-9]/g, "");

  /*
    Match:
    - exactly 3 letters
    - followed by 1 or 2 numbers

    Examples:
    ARG1
    FRA12
  */
      const match = cleaned.match(/[A-Z]{3}[0-9]{1,2}/);

      return match ? match[0] : null;
    }


    function saveCodes() {
      localStorage.setItem("cardCodes", JSON.stringify(codes));
      outputEl.value = codes.join("\n");
      countEl.textContent = codes.length;
    }

    function addCode(code) {
      if (!code) return;

      if (!codes.includes(code)) {
        codes.push(code);
        saveCodes();
        lastCodeEl.textContent = code;
        statusEl.textContent = `Added ${code}`;
      } else {
        lastCodeEl.textContent = code;
        statusEl.textContent = `${code} already scanned`;
      }
    }
    async function initCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusEl.textContent = "Camera unavailable. Use HTTPS or localhost.";
        return;
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: { ideal: "environment" },
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      });

      video.srcObject = stream;

      await new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play();
        };

        video.oncanplay = () => {
          if (video.videoWidth > 0 && video.videoHeight > 0) {
            cameraReady = true;
            resolve();
          }
        };
      });

      statusEl.textContent = "Camera ready. Align the code inside the green box.";
    }

    async function initOCR() {
      statusEl.textContent = "Loading OCR engine…";

      worker = await Tesseract.createWorker("eng");

      await worker.setParameters({
        tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789",
        tessedit_pageseg_mode: "7"
      });

      statusEl.textContent = "OCR ready.";
    }

    function captureScanRegion() {
      const videoWidth = video.videoWidth;
      const videoHeight = video.videoHeight;

      if (!videoWidth || !videoHeight) {
        throw new Error("Video is not ready yet.");
      }

      /*
        This crop roughly matches the green box:
        right/top corner area where the card code is expected.
        Adjust these numbers if your code is in a different position.
      */
      const cropX = videoWidth * 0.48;
      const cropY = videoHeight * 0.05;
      const cropW = videoWidth * 0.46;
      const cropH = videoHeight * 0.16;

      canvas.width = cropW;
      canvas.height = cropH;

      const ctx = canvas.getContext("2d", { willReadFrequently: true });

      ctx.drawImage(
        video,
        cropX,
        cropY,
        cropW,
        cropH,
        0,
        0,
        cropW,
        cropH
      );

      /*
        Basic contrast boost for OCR.
      */
      const imageData = ctx.getImageData(0, 0, cropW, cropH);
      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
        const boosted = avg > 140 ? 255 : 0;
        data[i] = boosted;
        data[i + 1] = boosted;
        data[i + 2] = boosted;
      }

      ctx.putImageData(imageData, 0, 0);

      return canvas;
    }

    async function scanOnce() {
      if (scanning) return;
      
      if (!cameraReady || video.videoWidth === 0 || video.videoHeight === 0) {
        statusEl.textContent = "Camera still warming up. Try again in a moment.";
        return;
      }

      if (!worker) {
        statusEl.textContent = "OCR not ready yet.";
        return;
      }

      scanning = true;
      statusEl.textContent = "Scanning…";

      try {
        const scanImage = captureScanRegion();
        const result = await worker.recognize(scanImage);
        const rawText = result.data.text || "";
        const code = normalizeCode(rawText);

        if (code) {
          addCode(code);
        } else {
          statusEl.textContent = `No valid code found. Expected ARG1 or FRA12 format. OCR saw: "${rawText.trim()}"`;
        }
      } catch (err) {
        statusEl.textContent = `Scan error: ${err.message}`;
      } finally {
        scanning = false;
      }
    }

    async function autoScanLoop() {
      while (autoScanning) {
        await scanOnce();
        await new Promise(resolve => setTimeout(resolve, 1200));
      }
    }

    scanBtn.addEventListener("click", scanOnce);

    autoBtn.addEventListener("click", () => {
      autoScanning = !autoScanning;

      if (autoScanning) {
        autoBtn.textContent = "Stop auto-scan";
        autoBtn.classList.remove("secondary");
        autoScanLoop();
      } else {
        autoBtn.textContent = "Start auto-scan";
        autoBtn.classList.add("secondary");
      }
    });

    copyBtn.addEventListener("click", async () => {
      await navigator.clipboard.writeText(codes.join("\n"));
      statusEl.textContent = "Copied list to clipboard.";
    });

    downloadBtn.addEventListener("click", () => {
      const csv = "code\n" + codes.map(code => `"${code}"`).join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = "card-codes.csv";
      a.click();

      URL.revokeObjectURL(url);
    });

    clearBtn.addEventListener("click", () => {
      if (!confirm("Clear all scanned codes?")) return;
      codes = [];
      saveCodes();
      lastCodeEl.textContent = "—";
      statusEl.textContent = "List cleared.";
    });

    saveCodes();

    Promise.all([
      initCamera(),
      initOCR()
    ]).catch(err => {
      statusEl.textContent = err.message;
    });
  </script>
</body>
</html>
